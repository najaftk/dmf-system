<style>

.field{margin-bottom:12px}
.lbl{font-size:12px;font-weight:700;color:#f59e0b;margin-bottom:5px;display:block}
.opt{font-size:10px;color:#64748b;font-weight:400}
.inp,.ta,.sel{width:100%;background:#111118;border:1px solid #1f1f2e;border-radius:8px;padding:10px 12px;color:#e2e8f0;font-size:13px;outline:none;font-family:inherit}
.inp:focus,.ta:focus,.sel:focus{border-color:#f59e0b}
.ta{resize:vertical;min-height:70px}
.row{border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;border:1.5px solid #1f1f2e;background:#111118;margin-bottom:8px}

.sname{font-size:14px;font-weight:800;color:#f8fafc;margin-top:4px}

.cname{font-weight:800;font-size:16px;color:#e2e8f0;margin-bottom:10px}

.phhdr{background:#0f1117;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.phttl{font-weight:700;color:#e2e8f0;font-size:14px}

.phbdy{padding:14px 18px}

<script>
const WU="https://old-waterfall-3f81.mahmoudhadhoud255790.workers.dev";
const COUNTRIES=[

{id:"sa",label:"السعودية",icon:"🇸🇦",regions:["كل المناطق","الرياض","مكة","المدينة","القصيم","الشرقية","عسير","تبوك","حائل","جازان","نجران","الباحة","الجوف"]},

];

{id:"ecommerce",label:"E-commerce",icon:"🛒"},{id:"services",label:"خدمات/كوتشنج",icon:"🎯"},
{id:"education",label:"تعليم/كورسات",icon:"🎓"},{id:"food",label:"مطاعم/فود",icon:"🍔"},
{id:"realestate",label:"عقارات",icon:"🏠"},{id:"health",label:"صحة/جمال",icon:"💊"},
{id:"fashion",label:"فاشون/ملابس",icon:"👗"},{id:"b2b",label:"B2B/شركات",icon:"🏢"}
];
const STAGES=[

{id:"b2c",label:"B2C — أفراد",icon:"🧑",desc:"عملاء عاديين"},{id:"b2b",label:"B2B — شركات",icon:"🏢",desc:"شركات ومؤسسات"},

{id:"google",label:"Google Ads",icon:"🔍",color:"#4285f4"},{id:"snapchat",label:"Snapchat",icon:"👻",color:"#fbbf24"}
];
const BUDGETS=[{id:"micro",label:"أقل من 5,000"},{id:"small",label:"5,000 - 15,000"},{id:"medium",label:"15,000 - 50,000"},{id:"large",label:"+50,000"}];
const DURS=[{id:"month",label:"شهر",icon:"📆",desc:"خطة سريعة"},{id:"quarter",label:"3 شهور",icon:"📅",desc:"الأفضل للحملات"},{id:"year",label:"سنة",icon:"🗓️",desc:"خطة شاملة"}];
const SLABELS=["الدولة","المجال","العرض","الجمهور","المنافسون","الموارد","الهدف","المنصة","الميزانية","الفترة"];
const RTABS=[
{id:"strategy",label:"الاستراتيجية",icon:"⚡"},{id:"audience",label:"الجمهور",icon:"👥"},
{id:"competitors",label:"المنافسون",icon:"🥊"},{id:"media",label:"Media Buying",icon:"📊"},
{id:"content",label:"المحتوى",icon:"🎬"},{id:"hooks",label:"الهوكات",icon:"🪝"},
{id:"funnel",label:"Sales Funnel",icon:"🔽"},{id:"journey",label:"Customer Journey",icon:"🗺️"},
{id:"plan",label:"خطة العمل",icon:"📋"}
];

let S={screen:"wizard",step:0,tab:"strategy",prog:0,err:"",res:null,
f:{country:"",region:"",whole:true,ind:"",bname:"",oname:"",odesc:"",price:"",
gender:"",ages:[],biz:"",comps:"",stage:"",website:"",team:"",content:"",
goal:"",plats:[],budget:"",mbudget:"",dur:""}};

function ok(){
const f=S.f;
switch(S.step){
case 0:return!!f.country;case 1:return!!f.ind;
case 2:return f.oname.trim()&&f.odesc.trim()&&f.price.trim();
case 3:return!!f.gender&&f.ages.length>0&&!!f.biz;
case 4:return!!f.stage;case 5:return!!f.website&&!!f.team&&!!f.content;
case 6:return!!f.goal;case 7:return f.plats.length>0;
case 8:return!!f.budget;case 9:return!!f.dur;
default:return true;}
}

function E(s){return String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function RL(items){return(items||[]).map(x=>'<div class="li"><span class="ld">◆</span><span>'+E(x)+'</span></div>').join("")}

function CTX(){
const f=S.f;
const country=COUNTRIES.find(x=>x.id===f.country)?.label||"";
const ind=INDS.find(x=>x.id===f.ind)?.label||"";
const stage=STAGES.find(x=>x.id===f.stage)?.label||"";
const gender=GENDERS.find(x=>x.id===f.gender)?.label||"";
const biz=BIZES.find(x=>x.id===f.biz)?.label||"";
const goal=GOALS.find(x=>x.id===f.goal)?.label||"";
const plats=f.plats.map(p=>PLATS.find(x=>x.id===p)?.label).join(", ");
const budget=BUDGETS.find(x=>x.id===f.budget)?.label||"";
const dur=DURS.find(x=>x.id===f.dur)?.label||"";
const loc=f.whole?country:f.region+", "+country;
return"المشروع:"+f.oname+"|المجال:"+ind+"|الدولة:"+loc+"|السعر:"+f.price+"|الهدف:"+goal+"|المنصات:"+plats+"|الميزانية:"+budget+"|الجنس:"+gender+"|الأعمار:"+f.ages.join(",")+"|نوع:"+biz+"|المرحلة:"+stage+(f.comps?"|منافسون:"+f.comps:"")+"|الوصف:"+f.odesc+"|فترة:"+dur;
}

async function API(prompt){
const res=await fetch(WU,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
const txt=await res.text();
if(!txt)throw new Error("استجابة فارغة");
let d;try{d=JSON.parse(txt)}catch(e){throw new Error("خطأ سيرفر: "+txt.substring(0,80))}
if(d.error)throw new Error(typeof d.error==="string"?d.error:d.error.message||JSON.stringify(d.error).substring(0,100));
if(!d.content)throw new Error("لا يوجد محتوى");
const text=d.content.map(i=>i.text||"").join("");
const clean=text.replace(/```json\s*/g,"").replace(/```\s*/g,"").trim();
const m=clean.match(/\{[\s\S]*\}/);
if(!m)throw new Error("لا يوجد JSON");
return JSON.parse(m[0]);
}

return"أنت DMF System محمود شعبان. "+CTX()+"\nJSON فقط:"+
'{"warnings":[],"strategy":{"positioningStatement":"","brandVsSales":"","usp":"","valueProposition":"","marketAnalysis":"","swot":{"strengths":[""],"weaknesses":[""],"opportunities":[""],"threats":[""]}},"audience":{"primaryPersona":{"name":"","age":"","gender":"","income":"","interests":[""],"painPoints":[""],"goals":[""],"objections":[""],"platforms":""},"secondaryPersona":"","metaTargeting":{"interests":[""],"behaviors":[""],"exclusions":[""],"lookalike":""},"tiktokTargeting":""}}';
}

'{"content":{"creativeDirection":"","contentPillars":["","","",""],"postingFrequency":"","monthlyPostDistribution":"","videoIdeas":[{"title":"","format":"","duration":"","platform":"","purpose":"","script":""}],"contentCalendar":""},"hooks":[{"type":"","text":"","platform":"","funnel":"","emotion":""}],"salesFunnel":{"stage1_traffic":{"title":"Stage 1: Traffic","description":"","platforms":"","creatives":"","budget":""},"stage2_landing":{"title":"Stage 2: Landing","description":"","structure":"","cta":"","elements":[""]},"stage3_lead":{"title":"Stage 3: Lead","description":"","leadMagnet":"","form":""},"stage4_email":{"title":"Stage 4: Email","description":"","emails":[""]},"stage5_sales":{"title":"Stage 5: Sales","description":"","tactics":[""],"objectionHandling":""},"stage6_retention":{"title":"Stage 6: Retention","description":"","tactics":[""]}},"customerJourney":{"awareness":{"stage":"Awareness","customerEmotion":"","touchpoints":[""],"yourAction":"","content":""},"consideration":{"stage":"Consideration","customerEmotion":"","touchpoints":[""],"yourAction":"","content":""},"decision":{"stage":"Decision","customerEmotion":"","touchpoints":[""],"yourAction":"","content":""},"purchase":{"stage":"Purchase","customerEmotion":"","touchpoints":[""],"yourAction":"","content":""},"loyalty":{"stage":"Loyalty","customerEmotion":"","touchpoints":[""],"yourAction":"","content":""}},"actionPlan":{"phases":[{"title":"","duration":"","objective":"","actions":[""],"budget":"","deliverables":[""],"kpis":[""]}],"weeklyCheckIns":"","monthlyReports":"","successCriteria":[""]}}';

async function RUN(){
S.screen="loading";S.prog=5;S.err="";render();
const iv=setInterval(()=>{if(S.prog<88){S.prog+=Math.random()*3;render()}},800);
try{
const [r1,r2,r3]=await Promise.all([API(P1()),API(P2()),API(P3())]);
clearInterval(iv);S.prog=96;render();
S.res=Object.assign({},r1,r2,r3);S.prog=100;render();
setTimeout(()=>{S.screen="results";S.tab="strategy";render()},400);
}catch(e){clearInterval(iv);S.err="خطأ: "+e.message;S.screen="wizard";render()}
}

function rStrategy(){
const r=S.res;if(!r)return"";const s=r.strategy||{};
let h="";
if(r.warnings&&r.warnings.length>0){h+='<div style="background:#1c0a00;border:1px solid #ea580c;border-radius:12px;padding:14px;margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:#f97316;margin-bottom:8px">⚠️ ملاحظات</div>';r.warnings.forEach(w=>{h+='<div style="font-size:13px;color:#fdba74;margin-bottom:4px">• '+E(w)+'</div>'});h+='</div>'}
h+='<div class="blk acc"><div class="bt">📍 Positioning</div><div class="btext">'+E(s.positioningStatement)+'</div></div>';
h+='<div class="blk"><div class="bt">👑 Brand vs Sales</div><div class="btext">'+E(s.brandVsSales)+'</div></div>';

h+='<div class="blk"><div class="bt">📊 تحليل السوق</div><div class="btext">'+E(s.marketAnalysis)+'</div></div>';

window.SC=id=>{S.f.country=id;S.f.region="";render()}
window.SW=v=>{S.f.whole=v;if(v)S.f.region="";render()}

window.SI=id=>{S.f.ind=id;render()}
window.SF=(k,v)=>{S.f[k]=v;render()}
window.SN=(k,v)=>{S.f[k]=v}
window.TF=(k,v)=>{S.f[k]=S.f[k].includes(v)?S.f[k].filter(x=>x!==v):[...S.f[k],v];render()}
window.NX=()=>{if(ok()&&S.step<9){S.step++;render()}}
window.BK=()=>{if(S.step>0){S.step--;render()}}
window.GT=id=>{S.tab=id;render()}
window.RST=()=>{S={screen:"wizard",step:0,tab:"strategy",prog:0,err:"",res:null,f:{country:"",region:"",whole:true,ind:"",bname:"",oname:"",odesc:"",price:"",gender:"",ages:[],biz:"",comps:"",stage:"",website:"",team:"",content:"",goal:"",plats:[],budget:"",mbudget:"",dur:""}};render()}
window.RN=()=>{const a=document.querySelector(".acts");if(!a)return;const can=ok();if(S.step<9){a.innerHTML=(S.step>0?'<button class="bbk" onclick="BK()">← رجوع</button>':"")+' <button class="bnx" '+(can?"":"disabled")+' onclick="NX()">التالي →</button>'}else{a.innerHTML=(S.step>0?'<button class="bbk" onclick="BK()">← رجوع</button>':"")+' <button class="brn" '+(can?"":"disabled")+' onclick="RUN()">🚀 ابدأ التحليل</button>'}}
